name: Release

# Builds release artifacts on old-glibc runners so they work across distros.
# - Tag push (vX.Y.Z): creates a draft release with the assets.
# - Manual run with a tag: rebuilds and REPLACES that release's assets in
#   place (used to ship fixes to an existing release without a new version;
#   the checked-out code's version must match the tag).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to update (e.g. v0.1.5)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build AppImage
        run: npm run tauri build -- --bundles appimage

      # The bundler copies the build host's libwayland-* into the AppImage.
      # Those old copies break EGL display creation against newer Mesa on
      # rolling-release hosts ("Could not create default EGL display"), so
      # strip them and let the target system's own wayland libs load.
      - name: Repack AppImage without bundled wayland libs
        run: |
          cd src-tauri/target/release/bundle/appimage
          APPIMAGE=$(ls *.AppImage)
          ./"$APPIMAGE" --appimage-extract
          rm -fv squashfs-root/usr/lib/libwayland-*.so*
          rm -f "$APPIMAGE"
          curl -sLo appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool

      - name: Sign AppImage (updater signature)
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cd src-tauri/target/release/bundle/appimage
          npm run --prefix "$GITHUB_WORKSPACE" tauri -- signer sign \
            --private-key "$KEY" --password "" "$(pwd)/$(ls *.AppImage)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npm run tauri build -- --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - name: Normalize asset names
        run: |
          cd assets
          find . -mindepth 2 -type f -exec mv {} . \;
          find . -mindepth 1 -type d -delete
          for f in *; do
            renamed=$(echo "$f" | tr ' ' '.')
            [ "$f" = "$renamed" ] || mv "$f" "$renamed"
          done
          ls -la

      - name: Generate updater manifest
        run: |
          python3 - "$TAG" <<'EOF'
          import json, sys, glob, datetime, pathlib
          tag = sys.argv[1]
          base = f"https://github.com/${{ github.repository }}/releases/download/{tag}"
          def one(pattern):
              m = glob.glob(f"assets/{pattern}")
              assert len(m) == 1, f"{pattern}: {m}"
              return pathlib.Path(m[0])
          appimage = one("*.AppImage"); exe = one("*-setup.exe")
          manifest = {
              "version": tag.lstrip("v"),
              "notes": f"Aseprite Compiler {tag}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "linux-x86_64": {
                      "signature": (appimage.parent / (appimage.name + ".sig")).read_text().strip(),
                      "url": f"{base}/{appimage.name}",
                  },
                  "windows-x86_64": {
                      "signature": (exe.parent / (exe.name + ".sig")).read_text().strip(),
                      "url": f"{base}/{exe.name}",
                  },
              },
          }
          pathlib.Path("assets/latest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps({k: v["url"] for k, v in manifest["platforms"].items()}, indent=2))
          EOF

      - name: Create or update release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing assets in place."
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber assets/*
          else
            echo "Creating draft release $TAG."
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Aseprite Compiler $TAG" \
              --notes "See the assets below. The app self-updates from this release." \
              assets/*
          fi
